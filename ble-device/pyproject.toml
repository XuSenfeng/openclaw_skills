[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "claude-code-ble-bridge"
version = "0.1.0"
description = "MCP server for Claude Code to connect Claude Desktop Buddy hardware device via BLE"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Claude Desktop Buddy Contributors" }
]
keywords = ["claude", "mcp", "ble", "hardware", "esp32"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "mcp>=1.0.0",
    "bleak>=0.21.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
]

[project.scripts]
claude-ble-bridge = "claude_code_ble_bridge.server:main"

[project.urls]
Homepage = "https://github.com/anthropics/claude-desktop-buddy"
Repository = "https://github.com/anthropics/claude-desktop-buddy"

[tool.hatch.build.targets.wheel]
packages = ["src/claude_code_ble_bridge"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/README.md",
]
